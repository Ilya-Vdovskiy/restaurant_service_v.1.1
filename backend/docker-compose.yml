services:
  postgres:
    image: postgres:16-alpine
    container_name: resto_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: resto_user
      POSTGRES_PASSWORD: resto_secret
      POSTGRES_DB: resto_lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resto_user -d resto_lms"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
